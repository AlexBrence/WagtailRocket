upstream django {
    server web:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name wagtailrocket.com www.wagtailrocket.com; # CHANGE_ME
    server_tokens off;
    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wagtailrocket.com www.wagtailrocket.com; # CHANGE_ME
    http2 on;
    client_max_body_size 10M;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wagtailrocket.com/fullchain.pem; # CHANGE_ME
    ssl_certificate_key /etc/letsencrypt/live/wagtailrocket.com/privkey.pem;   # CHANGE_ME
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /code/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
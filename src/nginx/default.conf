upstream django {
    server web:8000;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name wagtailrocket.com www.wagtailrocket.com;   # CHANGE_ME

    server_tokens off;
    client_max_body_size 10M;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        # return 301 https://wagtailrocket.com$request_uri;   # CHANGE_ME

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wagtailrocket.com www.wagtailrocket.com;       # CHANGE_ME

    http2 on;
    client_max_body_size 10M;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/wagtailrocket.com/fullchain.pem;     # CHANGE_ME
    ssl_certificate_key /etc/letsencrypt/live/wagtailrocket.com/privkey.pem;   # CHANGE_ME

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Let's Encrypt
    location /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    # Static files
    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Media files
    location /media/ {
        alias /code/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Django / Wagtail proxy
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}